name: checks

on:
  pull_request:

jobs:

 pre-commit:
   permissions:
     contents: read
   runs-on: ubuntu-latest
   container: public.ecr.aws/n8h5y2v5/rad-security/terraform-toolkit:1
   steps:
     - name: clone repo
       uses: actions/checkout@v4
     - name: pre-commit checks
       run: |
         git config --global --add safe.directory "$GITHUB_WORKSPACE"
         pre-commit-checks
