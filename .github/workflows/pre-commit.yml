name: checks

on:
  pull_request:

jobs:

 pre-commit:
   permissions:
     contents: read
   runs-on: ubuntu-latest
   steps:
     - name: clone repo
       uses: actions/checkout@v4
     # Run the toolkit with docker instead of as a job container: the runner
     # executes JavaScript actions such as checkout on Node 24, which fails on
     # the toolkit's Alpine 3.12 base.
     - name: pre-commit checks
       run: |
         docker run --rm -v "$PWD:/src" -w /src --entrypoint sh \
           ksoc/terraform-toolkit:1.0.8 \
           -c 'git config --global --add safe.directory /src && pre-commit-checks'
